name: Preview Docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[docs]
      - name: Deploy preview documentation
        run: |
          git fetch origin
          mike deploy dev -p --allow-empty
          echo "Preview URL: https://arch.gh.wzhecnu.cn/ChatCoolify/dev/" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- chatarch-pages-preview -->';
            const body = `${marker}\nPreview available at: https://arch.gh.wzhecnu.cn/ChatCoolify/dev/`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.data.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
