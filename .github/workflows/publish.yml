name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve package version
        id: package
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          module = ast.parse(Path("src/chatcoolify/__init__.py").read_text(encoding="utf-8"))
          for statement in module.body:
              if isinstance(statement, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in statement.targets
              ):
                  version = ast.literal_eval(statement.value)
                  break
          else:
              raise SystemExit("__version__ not found")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"tag=v{version}", file=output)
          PY
      - name: Check tag and branch provenance
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          test "${GITHUB_REF_NAME}" = "${RELEASE_TAG}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Check whether this version already exists
        id: pypi
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = f"https://pypi.org/pypi/ChatCoolify/{os.environ['PACKAGE_VERSION']}/json"
          exists = "false"
          try:
              urllib.request.urlopen(url, timeout=20)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              exists = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"exists={exists}", file=output)
          PY
      - name: Build distribution
        if: steps.pypi.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI with OIDC
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
